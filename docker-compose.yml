services:
  orbit:
    build:
      context: .
      dockerfile: Dockerfile
    image: zailom-orbit:latest
    container_name: zailom-orbit
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      HOST: 0.0.0.0
      TRUST_PROXY: "true"
      APP_ORIGIN: ${APP_ORIGIN:-https://orbit.zailom.com}
      DATABASE_URL: postgresql://${POSTGRES_USER:-orbit}:${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD in the .env file}@postgres:5432/${POSTGRES_DB:-orbit}?schema=public
    networks:
      - zailomOrbit_net
      - orbit_data_net
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.docker.network=zailomOrbit_net
      - traefik.http.routers.zailom-orbit.rule=Host(`orbit.zailom.com`)
      - traefik.http.routers.zailom-orbit.entrypoints=websecure
      - traefik.http.routers.zailom-orbit.tls=true
      - traefik.http.routers.zailom-orbit.service=zailom-orbit
      - traefik.http.routers.zailom-orbit-api.rule=Host(`api-orbit.zailom.com`)
      - traefik.http.routers.zailom-orbit-api.entrypoints=websecure
      - traefik.http.routers.zailom-orbit-api.tls=true
      - traefik.http.routers.zailom-orbit-api.service=zailom-orbit
      - traefik.http.services.zailom-orbit.loadbalancer.server.port=3001
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  postgres:
    image: postgres:16-alpine
    container_name: zailom-orbit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orbit}
      POSTGRES_DB: ${POSTGRES_DB:-orbit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD in the .env file}
    volumes:
      - orbit_postgres_data:/var/lib/postgresql/data
    networks:
      - orbit_data_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  orbit_postgres_data:

networks:
  zailomOrbit_net:
    external: true
  orbit_data_net:
    internal: true
